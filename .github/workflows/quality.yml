name: Pilot quality gate

on:
  pull_request:
  push:
    branches:
      - main
      - codex/makler-workflow-and-platform-update

permissions:
  contents: read

concurrency:
  group: pilot-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify repository integrity
        run: git diff --check
      - name: Run complete test suite
        run: npm test
      - name: Validate additive legal schema in isolated PostgreSQL
        run: |
          npm install --prefix "$RUNNER_TEMP/pilot-sql-check" --no-save --ignore-scripts @electric-sql/pglite@0.5.8
          node scripts/check-onboarding-sql.mjs "$RUNNER_TEMP/pilot-sql-check/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/check-customer-invitation-sql.mjs "$RUNNER_TEMP/pilot-sql-check/node_modules/@electric-sql/pglite/dist/index.js"
