name: Provision authorized heating test
on:
  push:
    branches: [codex/partner-region-reservations]
    paths: ['.github/workflows/provision-heating-test.yml']
permissions:
  contents: read
concurrency:
  group: heating-test-provision
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Provision only user-authorized test account
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HEATING_TEST_PASSWORD: ${{ secrets.HEATING_TEST_PASSWORD }}
        run: node scripts/provision-heating-test.mjs
