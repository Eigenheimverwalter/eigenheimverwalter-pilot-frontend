name: Pilot frontend zu ALL-INKL deployen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ziel und Zugang vollständig prüfen
        shell: bash
        env:
          FTP_HOST: ${{ secrets.ALLINKL_FTP_HOST }}
          FTP_USER: ${{ secrets.ALLINKL_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.ALLINKL_FTP_PASSWORD }}
          TARGET_DIR: ${{ vars.ALLINKL_PILOT_TARGET_DIR }}
        run: |
          set -euo pipefail
          test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$FTP_PASSWORD"
          [[ "$TARGET_DIR" =~ ^/[^[:space:]]*pilot[^[:space:]]*/$ ]] || { echo 'Das Zielverzeichnis muss absolut sein, mit / enden und eindeutig "pilot" enthalten.'; exit 1; }
      - name: Render-freies statisches Frontend bauen
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          PILOT_PUBLIC_URL: https://eigenheimverwalter-pilot.de
        run: node scripts/build-static-frontend.mjs dist
      - name: Zu ALL-INKL über FTPS übertragen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.ALLINKL_FTP_HOST }}
          username: ${{ secrets.ALLINKL_FTP_USERNAME }}
          password: ${{ secrets.ALLINKL_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ vars.ALLINKL_PILOT_TARGET_DIR }}
      - name: Öffentliche Oberfläche prüfen
        run: |
          set -euo pipefail
          page=$(curl --fail --silent --show-error https://eigenheimverwalter-pilot.de/)
          echo "$page" | grep -q 'eigenheimverwalter Pilot'
          config=$(curl --fail --silent --show-error https://eigenheimverwalter-pilot.de/runtime-config.js)
          echo "$config" | grep -q "authMode:'supabase'"
          test "$(echo "$config" | grep -c 'onrender.com')" = "0"

