name: Pilot mail smoke test

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: Kontrollierter Empfänger
        required: true
        type: string
      channel:
        description: Zu prüfender Absenderkanal
        required: true
        default: partner
        type: choice
        options:
          - partner
          - registration
          - info
          - all

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: rpniwtshbwjuesoeztyt

jobs:
  send:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Validate recipient
        shell: bash
        env:
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          [[ "$RECIPIENT" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]] || exit 1
      - name: Send controlled mail
        shell: bash
        env:
          RECIPIENT: ${{ inputs.recipient }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          MAIL_TOKEN: ${{ secrets.PILOT_MAIL_GATEWAY_TOKEN }}
        run: |
          set -euo pipefail
          test "${#MAIL_TOKEN}" -ge 32
          endpoint="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/portal-mail"
          channels="$REQUESTED_CHANNEL"
          if [ "$REQUESTED_CHANNEL" = "all" ]; then channels="partner registration info"; fi
          for channel in $channels; do
            payload=$(jq -nc \
              --arg channel "$channel" \
              --arg recipient "$RECIPIENT" \
              --arg subject "eigenheimverwalter Pilot-Mailtest · ${channel}" \
              --arg message "Kontrollierter Versandtest des dedizierten Pilot-Mailgateways. Kanal: ${channel}." \
              '{action:"pilot_send_email",channel:$channel,recipientEmail:$recipient,subject:$subject,message:$message}')
            response=$(curl --silent --show-error --write-out '\n%{http_code}' \
              -X POST "$endpoint" \
              -H "Content-Type: application/json" \
              -H "x-pilot-mail-token: ${MAIL_TOKEN}" \
              --data "$payload")
            status=$(tail -n1 <<< "$response")
            body=$(sed '$d' <<< "$response")
            echo "${channel}: HTTP ${status} ${body}"
            test "$status" = "200"
          done
