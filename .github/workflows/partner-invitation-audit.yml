name: Partner invitation delivery audit

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: rpniwtshbwjuesoeztyt

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Read delivery receipts for the requested partners
        shell: bash
        env:
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test "${#SERVICE_ROLE_KEY}" -ge 32
          endpoint="https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/partner_onboardings?source=eq.SALES_OS&select=id,status,requested_plan,partner_type,prefilled_data,invitation_delivery_status,invitation_attempted_at,invitation_sent_at,created_at,expires_at"
          response=$(curl --fail --silent --show-error "$endpoint" \
            -H "apikey: ${SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SERVICE_ROLE_KEY}")
          central=$(jq '[.[] | select((.prefilled_data.company // "" | ascii_downcase | contains("kiel finanz")) or (.prefilled_data.company // "" | ascii_downcase | contains("iv immo verkauf hamburg"))) | {company:.prefilled_data.company,source:"central",partner_status:.status,delivery_status:.invitation_delivery_status,attempted_at:.invitation_attempted_at,sent_at:.invitation_sent_at,expires_at}]' <<< "$response")
          runtime=$(curl --fail --silent --show-error \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/portal_runtime_state?id=eq.primary&select=payload" \
            -H "apikey: ${SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SERVICE_ROLE_KEY}")
          legacy=$(jq '[.[0].payload as $s | ($s.partners // [])[] | select((.company // "" | ascii_downcase | contains("kiel finanz")) or (.company // "" | ascii_downcase | contains("iv immo verkauf hamburg"))) | . as $p | (($s.partnerInvitations // []) | map(select(.partnerId == $p.id)) | first) as $i | {company:$p.company,source:"runtime",partner_status:$p.status,delivery_status:($i.mailStatus // null),attempted_at:($i.mailAttemptedAt // null),sent_at:($i.sentAt // null),expires_at:($i.expiresAt // null)}]' <<< "$runtime")
          matches=$(jq -s 'add | unique_by(.company)' <(printf '%s' "$central") <(printf '%s' "$legacy"))
          count=$(jq 'length' <<< "$matches")
          test "$count" -eq 2 || { echo "Erwartet wurden genau zwei Partnerdatensätze, gefunden: $count"; jq '[.[] | {company,source,partner_status}]' <<< "$matches"; exit 1; }
          jq '.' <<< "$matches"
          jq -e 'all(.[]; .delivery_status == "sent" and (.sent_at | type == "string"))' <<< "$matches" >/dev/null
