name: Pilot-Produktivspiegel nach Supabase importieren

on:
  workflow_dispatch:
  schedule:
    # Avoid the heavily loaded top-of-hour minute while retaining a 5-minute cadence.
    - cron: '2-59/5 * * * *'

concurrency:
  group: pilot-production-mirror-import
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://rpniwtshbwjuesoeztyt.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Produktivspiegel verschlüsselt abrufen
        env:
          PILOT_MIGRATION_EXPORT_URL: ${{ secrets.PILOT_MIGRATION_EXPORT_URL }}
          PILOT_MIGRATION_EXPORT_TOKEN: ${{ secrets.PILOT_MIGRATION_EXPORT_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p tmp/source
          base="${PILOT_MIGRATION_EXPORT_URL%/api/migration/export}"
          test "$base" = "https://api.eigenheimverwalter.de" || { echo "Unerwartete Produktivquelle"; exit 1; }
          curl --fail --silent --show-error --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
            "$base/api/migration/production-export" \
            -H "Authorization: Bearer ${PILOT_MIGRATION_EXPORT_TOKEN}" \
            -o tmp/source/production-mirror.json
      - name: In aktuellen Supabase-Stand atomar einfügen
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/import-production-mirror.mjs tmp/source/production-mirror.json
