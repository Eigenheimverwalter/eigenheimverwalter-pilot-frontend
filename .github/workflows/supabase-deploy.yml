name: Supabase deploy

on:
  workflow_dispatch:
  push:
    branches: [codex/makler-workflow-and-platform-update]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: rpniwtshbwjuesoeztyt
  ALLINKL_FTP_HOST: ${{ secrets.ALLINKL_FTP_HOST }}
  ALLINKL_FTP_USERNAME: ${{ secrets.ALLINKL_FTP_USERNAME }}
  ALLINKL_FTP_PASSWORD: ${{ secrets.ALLINKL_FTP_PASSWORD }}
  ALLINKL_PILOT_TARGET_DIR: ${{ vars.ALLINKL_PILOT_TARGET_DIR }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pin the CLI so deployments do not depend on GitHub's release API
          # and remain reproducible when that API is rate-limited.
          version: 2.116.0
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Apply database migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Verify required Pilot function secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          secret_names=$(supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" --output json | jq -r '.[].name')
          grep -Fxq 'PILOT_MAIL_GATEWAY_TOKEN' <<< "$secret_names" || { echo 'PILOT_MAIL_GATEWAY_TOKEN fehlt im dedizierten Pilot-Projekt.'; exit 1; }
          for name in SMTP_PARTNER_PASSWORD SMTP_REGISTRATION_PASSWORD SMTP_INFO_PASSWORD; do
            grep -Fxq "$name" <<< "$secret_names" || { echo "$name fehlt im dedizierten Pilot-Projekt."; exit 1; }
          done
      - name: Deploy Edge Functions
        run: |
          supabase functions deploy document-api --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy portal-api --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy portal-mail --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy portal-public --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Configure Render-free Pilot auth redirects
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash scripts/configure-pilot-auth.sh
      - name: Reconcile required Pilot info admin
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bash scripts/bootstrap-pilot-admin.sh
      - name: Smoke-test Pilot backend
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          health=$(curl --fail --silent "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/portal-api/health")
          echo "$health" | grep -q '"projectRef":"rpniwtshbwjuesoeztyt"'
          mail_health=$(curl --fail --silent "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/portal-mail/health")
          echo "$mail_health" | grep -q '"status":"ok"'
          public_health=$(curl --fail --silent "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/portal-public/health")
          echo "$public_health" | grep -q '"status":"ok"'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/documents?select=id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          test "$status" = "200" || { echo "Datenbank-Smoke-Test fehlgeschlagen (HTTP $status)."; exit 1; }
          trade_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/trades?select=code&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          test "$trade_status" = "200" || { echo "Fachmodell-Smoke-Test fehlgeschlagen (HTTP $trade_status)."; exit 1; }
          identity_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/identity_imports?select=source_user_id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          test "$identity_status" = "200" || { echo "Auth-/Import-Smoke-Test fehlgeschlagen (HTTP $identity_status)."; exit 1; }
          migration_status=$(curl --fail --silent -X POST \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/rpc/pilot_migration_status" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          echo "$migration_status" | jq '{customers,properties,propertyFiles,availableDocuments,runtimeRevision,activeAdminProfiles,activeInfoAdmin}'
          echo "$migration_status" | jq -e '.customers == 194 and .properties == 148 and .propertyFiles == 522 and .availableDocuments >= 93 and .runtimeRevision > 0 and .activeAdminProfiles >= 1 and .activeInfoAdmin == true' >/dev/null || { echo "Supabase-Daten-, Auth- oder Admin-Integrität nicht bestätigt."; exit 1; }
      - name: Smoke-test authenticated Pilot role and ACL
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: bash scripts/smoke-pilot-auth.sh
      - name: Validate ALL-INKL frontend target
        if: ${{ env.ALLINKL_FTP_HOST != '' && env.ALLINKL_FTP_USERNAME != '' && env.ALLINKL_FTP_PASSWORD != '' && env.ALLINKL_PILOT_TARGET_DIR != '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ALLINKL_PILOT_TARGET_DIR" =~ ^/[^[:space:]]*pilot[^[:space:]]*/$ ]] || { echo 'Das Zielverzeichnis muss absolut sein, mit / enden und eindeutig "pilot" enthalten.'; exit 1; }
      - name: Build Render-free frontend
        if: ${{ env.ALLINKL_FTP_HOST != '' && env.ALLINKL_FTP_USERNAME != '' && env.ALLINKL_FTP_PASSWORD != '' && env.ALLINKL_PILOT_TARGET_DIR != '' }}
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          PILOT_PUBLIC_URL: https://eigenheimverwalter-pilot.de
        run: node scripts/build-static-frontend.mjs dist
      - name: Deploy frontend to ALL-INKL
        if: ${{ env.ALLINKL_FTP_HOST != '' && env.ALLINKL_FTP_USERNAME != '' && env.ALLINKL_FTP_PASSWORD != '' && env.ALLINKL_PILOT_TARGET_DIR != '' }}
        uses: SamKirkland/FTP-Deploy-Action@fe9c9aad1198372d80a77c8dace63cbe48b69eac
        with:
          server: ${{ env.ALLINKL_FTP_HOST }}
          username: ${{ env.ALLINKL_FTP_USERNAME }}
          password: ${{ env.ALLINKL_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ env.ALLINKL_PILOT_TARGET_DIR }}
          dangerous-clean-slate: false
      - name: Verify ALL-INKL frontend
        if: ${{ env.ALLINKL_FTP_HOST != '' && env.ALLINKL_FTP_USERNAME != '' && env.ALLINKL_FTP_PASSWORD != '' && env.ALLINKL_PILOT_TARGET_DIR != '' }}
        shell: bash
        run: |
          set -euo pipefail
          page=$(curl --fail --silent --show-error https://eigenheimverwalter-pilot.de/)
          echo "$page" | grep -q 'eigenheimverwalter Pilot'
          config=$(curl --fail --silent --show-error https://eigenheimverwalter-pilot.de/runtime-config.js)
          echo "$config" | grep -q "authMode:'supabase'"
          test "$(echo "$config" | grep -c 'onrender.com')" = "0"
      - name: Report pending ALL-INKL credentials
        if: ${{ env.ALLINKL_FTP_HOST == '' || env.ALLINKL_FTP_USERNAME == '' || env.ALLINKL_FTP_PASSWORD == '' || env.ALLINKL_PILOT_TARGET_DIR == '' }}
        run: echo 'Supabase ist vollständig bereitgestellt; Frontend-Cutover wartet auf die vier ALL-INKL-Umgebungswerte.'
