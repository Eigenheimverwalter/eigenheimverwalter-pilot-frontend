name: Supabase deploy

on:
  workflow_dispatch:
  push:
    branches: [codex/makler-workflow-and-platform-update]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: rpniwtshbwjuesoeztyt

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pin the CLI so deployments do not depend on GitHub's release API
          # and remain reproducible when that API is rate-limited.
          version: 2.116.0
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Apply database migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Verify required Pilot function secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          secret_names=$(supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" --output json | jq -r '.[].name')
          grep -Fxq 'PILOT_MAIL_GATEWAY_TOKEN' <<< "$secret_names" || { echo 'PILOT_MAIL_GATEWAY_TOKEN fehlt im dedizierten Pilot-Projekt.'; exit 1; }
          for name in SMTP_PARTNER_PASSWORD SMTP_REGISTRATION_PASSWORD SMTP_INFO_PASSWORD; do
            grep -Fxq "$name" <<< "$secret_names" || { echo "$name fehlt im dedizierten Pilot-Projekt."; exit 1; }
          done
      - name: Deploy Edge Functions
        run: |
          supabase functions deploy document-api --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy portal-api --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy portal-mail --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy portal-public --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Merge confidential production mirror
        shell: bash
        env:
          PILOT_MIGRATION_EXPORT_URL: ${{ secrets.PILOT_MIGRATION_EXPORT_URL }}
          PILOT_MIGRATION_EXPORT_TOKEN: ${{ secrets.PILOT_MIGRATION_EXPORT_TOKEN }}
          SUPABASE_URL: https://rpniwtshbwjuesoeztyt.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$PILOT_MIGRATION_EXPORT_URL" || { echo 'PILOT_MIGRATION_EXPORT_URL fehlt.'; exit 1; }
          test -n "$PILOT_MIGRATION_EXPORT_TOKEN" || { echo 'PILOT_MIGRATION_EXPORT_TOKEN fehlt.'; exit 1; }
          export_base="${PILOT_MIGRATION_EXPORT_URL%/api/migration/export}"
          mkdir -p tmp/source
          curl --fail --silent --show-error \
            "$export_base/api/migration/production-export" \
            -H "Authorization: Bearer $PILOT_MIGRATION_EXPORT_TOKEN" \
            --output tmp/source/production-mirror.json
          node scripts/import-production-mirror.mjs tmp/source/production-mirror.json | tee tmp/production-import-result.json
          jq -e '.status == "validated" and .customers > 0 and .properties > 0' tmp/production-import-result.json >/dev/null
      - name: Import available production documents
        shell: bash
        env:
          PILOT_MIGRATION_EXPORT_URL: ${{ secrets.PILOT_MIGRATION_EXPORT_URL }}
          PILOT_MIGRATION_EXPORT_TOKEN: ${{ secrets.PILOT_MIGRATION_EXPORT_TOKEN }}
          SUPABASE_URL: https://rpniwtshbwjuesoeztyt.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          export PILOT_MIGRATION_EXPORT_BASE="${PILOT_MIGRATION_EXPORT_URL%/api/migration/export}"
          node scripts/import-production-documents.mjs tmp/source/production-mirror.json | tee tmp/production-document-import-result.json
          jq -e '.status == "validated" and .total > 0 and .failed == 0' tmp/production-document-import-result.json >/dev/null
      - name: Smoke-test Pilot backend
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          health=$(curl --fail --silent "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/portal-api/health")
          echo "$health" | grep -q '"projectRef":"rpniwtshbwjuesoeztyt"'
          mail_health=$(curl --fail --silent "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/portal-mail/health")
          echo "$mail_health" | grep -q '"status":"ok"'
          public_health=$(curl --fail --silent "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/portal-public/health")
          echo "$public_health" | grep -q '"status":"ok"'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/documents?select=id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          test "$status" = "200" || { echo "Datenbank-Smoke-Test fehlgeschlagen (HTTP $status)."; exit 1; }
          trade_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/trades?select=code&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          test "$trade_status" = "200" || { echo "Fachmodell-Smoke-Test fehlgeschlagen (HTTP $trade_status)."; exit 1; }
          identity_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/identity_imports?select=source_user_id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          test "$identity_status" = "200" || { echo "Auth-/Import-Smoke-Test fehlgeschlagen (HTTP $identity_status)."; exit 1; }
          migrated_document_count=$(curl --fail --silent \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/documents?select=id&source_entity_type=eq.production_property_file" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" | jq 'length')
          test "$migrated_document_count" -ge 93 || { echo "Produktivdokumente unvollständig: $migrated_document_count statt mindestens 93."; exit 1; }
