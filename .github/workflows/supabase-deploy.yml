name: Supabase deploy

on:
  workflow_dispatch:
  push:
    branches: [codex/makler-workflow-and-platform-update]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: rpniwtshbwjuesoeztyt

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify isolated Pilot credentials
        shell: bash
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "SUPABASE_PUBLISHABLE_KEY fehlt im Environment staging."; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "SUPABASE_SERVICE_ROLE_KEY fehlt im Environment staging."; exit 1; }
          case "$SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*|eyJ*) ;; *) echo "Publishable Key hat ein unbekanntes Format."; exit 1;; esac
          case "$SUPABASE_SERVICE_ROLE_KEY" in sb_secret_*|eyJ*) ;; *) echo "Service Role/Secret Key hat ein unbekanntes Format."; exit 1;; esac
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}")
          test "$status" = "200" || { echo "Publishable Key gehört nicht zum erreichbaren Pilotprojekt (HTTP $status)."; exit 1; }
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Apply database migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Deploy Edge Functions
        run: supabase functions deploy document-api --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
