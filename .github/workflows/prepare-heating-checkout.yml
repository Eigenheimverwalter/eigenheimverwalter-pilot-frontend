name: Prepare authorized heating checkout test
on:
  workflow_dispatch:
  push:
    branches: [codex/partner-region-reservations]
    paths: ['.github/workflows/prepare-heating-checkout.yml']
permissions:
  contents: read
concurrency:
  group: heating-checkout-test-setup
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolate test flow and approved test documents
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/prepare-heating-checkout.mjs
      - name: Verify Pilot Stripe secret names without values
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/check-pilot-stripe-secret-names.mjs
